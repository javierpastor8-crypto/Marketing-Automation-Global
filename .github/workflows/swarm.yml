name: Matriz V8 Eternal Swarm - Marketing Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5,11,17,23 * * *'

permissions:
  contents: write

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Eternal Autonomous Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          CLICKBANK_AFFILIATE_ID: ${{ secrets.CLICKBANK_AFFILIATE_ID }}
          DIGISTORE_AFFILIATE_ID: ${{ secrets.DIGISTORE_AFFILIATE_ID }}
          NICHO_NAME: "Marketing_Automation_Global"
        run: |
          python matriz_v8_master.py
